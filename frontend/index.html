<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/petcare.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetCare - Pet Health Tracker</title>

    <!-- PWA Meta Tags -->
    <!-- surface-0 hex matches vite-plugin-pwa manifest theme_color so the
         browser address bar / status bar tints to the dark theme on first
         paint, with no light flash. -->
    <meta name="theme-color" content="#0E1218" />
    <meta name="description" content="Track your pet's health, meals, and weight" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PetCare" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
