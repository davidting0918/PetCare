<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PetCare — iOS Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #0B0B16;
    --surface: #16162A;
    --surface-elev: #1E1E36;
    --border: #25254A;
    --border-strong: #3B3B6B;
    --text-primary: #F1F1FA;
    --text-secondary: #A8A8C4;
    --text-muted: #6B6B8C;
    --primary: #A855F7;
    --primary-hover: #9333EA;
    --primary-soft: rgba(168, 85, 247, 0.16);
    --accent: #38BDF8;
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #F87171;
    --chart-1: #A855F7;
    --chart-2: #38BDF8;
    --chart-3: #F472B6;
    --chart-4: #818CF8;
    --shadow: 0 0 0 1px rgba(255,255,255,0.04);
    --is-dark: 1;
  }
  :root[data-theme="daylight"] {
    --bg: #F4F6FB;
    --surface: #FFFFFF;
    --surface-elev: #FFFFFF;
    --border: #E4E7EE;
    --border-strong: #CBD0DA;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-soft: rgba(79, 70, 229, 0.10);
    --accent: #64748B;
    --success: #10B981;
    --warning: #F59E0B;
    --danger: #EF4444;
    --chart-1: #4F46E5;
    --chart-2: #06B6D4;
    --chart-3: #8B5CF6;
    --chart-4: #64748B;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.04);
    --is-dark: 0;
  }
  :root[data-theme="nordic"] {
    --bg: #ECEFF3;
    --surface: #F6F8FA;
    --surface-elev: #FFFFFF;
    --border: #DDE3E8;
    --border-strong: #B6BFC8;
    --text-primary: #1F2933;
    --text-secondary: #52606D;
    --text-muted: #9AA5B1;
    --primary: #3F7B8C;
    --primary-hover: #335F6E;
    --primary-soft: rgba(63, 123, 140, 0.12);
    --accent: #7A8FA0;
    --success: #4A8C75;
    --warning: #B89248;
    --danger: #B05B5B;
    --chart-1: #3F7B8C;
    --chart-2: #7A8FA0;
    --chart-3: #5C8C7C;
    --chart-4: #B6BFC8;
    --shadow: 0 1px 2px rgba(31, 41, 51, 0.04), 0 6px 20px rgba(31, 41, 51, 0.05);
    --is-dark: 0;
  }
  :root[data-theme="ocean"] {
    --bg: #07182B;
    --surface: #0F2238;
    --surface-elev: #173049;
    --border: #1E3A57;
    --border-strong: #2C4F70;
    --text-primary: #E8F1FA;
    --text-secondary: #93AEC9;
    --text-muted: #5D7691;
    --primary: #22D3EE;
    --primary-hover: #06B6D4;
    --primary-soft: rgba(34, 211, 238, 0.12);
    --accent: #BAE6FD;
    --success: #2DD4BF;
    --warning: #FDE68A;
    --danger: #FB7185;
    --chart-1: #22D3EE;
    --chart-2: #38BDF8;
    --chart-3: #2DD4BF;
    --chart-4: #7DD3FC;
    --shadow: 0 0 0 1px rgba(255,255,255,0.03);
    --is-dark: 1;
  }
  :root[data-theme="graphite"] {
    --bg: #0A0A0A;
    --surface: #141414;
    --surface-elev: #1C1C1C;
    --border: #262626;
    --border-strong: #383838;
    --text-primary: #FAFAFA;
    --text-secondary: #A3A3A3;
    --text-muted: #6B6B6B;
    --primary: #84CC16;
    --primary-hover: #65A30D;
    --primary-soft: rgba(132, 204, 22, 0.14);
    --accent: #525252;
    --success: #84CC16;
    --warning: #D4D4D4;
    --danger: #EF4444;
    --chart-1: #84CC16;
    --chart-2: #65A30D;
    --chart-3: #525252;
    --chart-4: #A3A3A3;
    --shadow: 0 0 0 1px rgba(255,255,255,0.04);
    --is-dark: 1;
  }
  :root[data-theme="mono"] {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-elev: #FAFAFA;
    --border: #EAEAEA;
    --border-strong: #0A0A0A;
    --text-primary: #0A0A0A;
    --text-secondary: #525252;
    --text-muted: #A3A3A3;
    --primary: #3E5A75;
    --primary-hover: #2D4660;
    --primary-soft: rgba(62, 90, 117, 0.08);
    --accent: #525252;
    --success: #3E5A75;
    --warning: #525252;
    --danger: #0A0A0A;
    --chart-1: #3E5A75;
    --chart-2: #A3A3A3;
    --chart-3: #525252;
    --chart-4: #D4D4D4;
    --shadow: 0 1px 0 #EAEAEA;
    --is-dark: 0;
  }

  html, body { background:#0A0A0F; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
  :root[data-theme="daylight"] body, :root[data-theme="nordic"] body, :root[data-theme="mono"] body { background:#E7EAF0; }
  :root[data-theme="ocean"] body { background:#040E1C; }
  :root[data-theme="graphite"] body { background:#050505; }

  /* iPhone 15 Pro frame */
  .iphone {
    width: 390px; height: 844px;
    border-radius: 48px;
    background: var(--bg);
    color: var(--text-primary);
    box-shadow: 0 0 0 8px #1a1a1f, 0 0 0 9px #2a2a31, 0 30px 60px -20px rgba(0,0,0,0.55);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    isolation: isolate;
  }
  .iphone-screen { width: 100%; height: 100%; overflow:hidden; display:flex; flex-direction:column; background: var(--bg); }
  .notch {
    position:absolute; top:11px; left:50%; transform:translateX(-50%);
    width:120px; height:35px; background:#000; border-radius:24px; z-index:50;
  }
  .frame-label {
    position:absolute; bottom:-30px; left:0; right:0;
    text-align:center; font-size:11px; color:#7b7b8a;
    letter-spacing:0.04em; text-transform:uppercase; font-weight:500;
  }
  .frame-num {
    position:absolute; top:-26px; left:6px;
    font-size:10px; color:#6a6a78; letter-spacing:0.08em; font-weight:600;
  }

  /* App surfaces (theme-tokenized) */
  .surf { background: var(--surface); }
  .surf-elev { background: var(--surface-elev); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .card-elev {
    background: var(--surface-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .divider { border-color: var(--border); }
  .btn {
    border-radius: 12px;
    padding: 14px 18px;
    font-weight: 600;
    font-size: 15px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  :root[data-theme="mono"] .btn-primary { color:#fff; }
  :root[data-theme="ocean"] .btn-primary { color:#062330; }
  :root[data-theme="graphite"] .btn-primary { color:#0A0A0A; }
  .btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); }
  .input {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text-primary);
    padding: 12px 14px;
    width: 100%;
    font-size: 15px;
  }
  .input::placeholder { color: var(--text-muted); }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip.active { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
  .pill {
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .t-primary { color: var(--text-primary); }
  .t-secondary { color: var(--text-secondary); }
  .t-muted { color: var(--text-muted); }
  .bg-primary { background: var(--primary); }
  .text-primary-color { color: var(--primary); }
  .text-success { color: var(--success); }
  .text-warning { color: var(--warning); }
  .text-danger { color: var(--danger); }
  .bg-soft { background: var(--primary-soft); }
  .border-soft { border-color: var(--border); }
  .border-strong { border-color: var(--border-strong); }

  /* Status bar */
  .status-bar {
    height: 54px; padding: 18px 28px 0; display:flex; justify-content:space-between; align-items:center;
    font-size: 15px; font-weight: 600; color: var(--text-primary);
    flex-shrink: 0; z-index: 40;
  }
  .status-bar .right { display:flex; align-items:center; gap:6px; }
  .status-bar svg { width:16px; height:16px; }

  /* Tab bar */
  .tab-bar {
    position:absolute; bottom:0; left:0; right:0;
    background: color-mix(in oklab, var(--surface) 92%, transparent);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 16px 28px;
    display: grid; grid-template-columns: repeat(5, 1fr);
    z-index: 30;
  }
  .tab {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--text-muted); font-size: 10px; font-weight: 500;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--primary); }

  /* Bottom sheet */
  .sheet {
    position:absolute; left:0; right:0; bottom:0;
    background: var(--surface-elev);
    border-top-left-radius: 24px; border-top-right-radius: 24px;
    padding: 12px 20px 40px;
    border-top: 1px solid var(--border);
    box-shadow: 0 -20px 40px rgba(0,0,0,0.18);
    z-index: 35;
  }
  .sheet-handle { width:36px; height:4px; background:var(--border-strong); border-radius:4px; margin: 4px auto 16px; opacity: 0.6; }
  .sheet-backdrop {
    position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index: 32;
  }

  /* Scroll strip */
  .strip {
    display:flex; gap: 72px;
    padding: 80px 80px 80px;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    align-items: flex-start;
  }
  .strip > div { scroll-snap-align: start; }
  .strip::-webkit-scrollbar { height: 10px; }
  .strip::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
  .strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 5px; }

  /* Toolbar */
  .toolbar {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(16px);
    background: rgba(10, 10, 15, 0.78);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: #E5E5EF;
  }
  .theme-btn {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #B8B8C7;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.04);
    display:inline-flex; align-items:center; gap:8px;
    transition: all 0.15s ease;
  }
  .theme-btn:hover { color:#fff; border-color: rgba(255,255,255,0.20); }
  .theme-btn.active { background:#fff; color:#0A0A0F; border-color:#fff; }
  .theme-swatch {
    width:14px; height:14px; border-radius:4px;
    border: 1px solid rgba(255,255,255,0.15);
    display:inline-block;
    background: linear-gradient(135deg, var(--sw1) 0% 50%, var(--sw2) 50% 100%);
  }

  /* Pet photo placeholder */
  .pet-img {
    background: linear-gradient(135deg, var(--primary-soft), var(--surface-elev));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border: 1px solid var(--border);
  }
  .pet-img.emoji { font-size: 28px; }

  /* progress ring */
  .ring-track { stroke: var(--border); }
  .ring-bar-1 { stroke: var(--chart-1); }
  .ring-bar-2 { stroke: var(--chart-2); }

  /* Mini sparkline area gradient */
  .area-fill-1 { fill: var(--chart-1); opacity: 0.12; }

  /* avatars */
  .avatar {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary);
    display:inline-flex; align-items:center; justify-content:center;
    font-size: 11px; font-weight: 700;
    border: 2px solid var(--surface);
  }
  .avatar.lg { width: 56px; height: 56px; font-size: 18px; }
  .avatar.xl { width: 80px; height: 80px; font-size: 28px; }

  /* utility */
  .h-stack { display:flex; align-items:center; }
  .v-stack { display:flex; flex-direction:column; }
  .grow { flex: 1; min-width: 0; }
  .ico-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; }
  .ico-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }

  /* Hide ios safe-area handle */
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 5px;
    background: var(--text-primary); opacity: 0.6;
    z-index: 60;
  }

  .scroll-y { overflow-y: auto; overflow-x: hidden; }
  .scroll-y::-webkit-scrollbar { width: 0; }

  /* fab */
  .fab {
    position:absolute; right: 18px; bottom: 96px;
    width: 56px; height: 56px; border-radius: 999px;
    background: var(--primary); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    box-shadow: 0 12px 28px -8px var(--primary);
    z-index: 25;
  }
  :root[data-theme="ocean"] .fab { color:#062330; }
  :root[data-theme="graphite"] .fab { color:#0A0A0A; }
  .fab svg { width: 24px; height: 24px; }

  /* Headline */
  h1.title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }
  h2.title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
  .caption { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

  /* food type icon */
  .type-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--primary-soft); color: var(--primary);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .type-icon svg { width: 18px; height: 18px; }

  /* progress segment */
  .seg { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .seg > i { display:block; height:100%; background: var(--primary); border-radius:999px; }

  /* slider */
  .slider-track { height: 6px; border-radius: 999px; background: var(--border); position: relative; }
  .slider-fill { position:absolute; left:0; top:0; bottom:0; background: var(--primary); border-radius: 999px; }
  .slider-thumb { position:absolute; top:50%; transform:translate(-50%,-50%); width:16px; height:16px; border-radius:999px; background: var(--surface-elev); border: 2px solid var(--primary); }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="max-w-[1600px] mx-auto px-8 py-4 flex items-center justify-between gap-6">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg,#A855F7,#38BDF8);">
        <i data-lucide="paw-print" class="w-4 h-4 text-white"></i>
      </div>
      <div>
        <div class="text-[15px] font-semibold tracking-tight">PetCare — iOS Prototype</div>
        <div class="text-[11px]" style="color:#7b7b8a;">12 screens · 6 themes · iPhone 15 Pro</div>
      </div>
    </div>
    <div class="flex items-center gap-2" id="themePicker">
      <button class="theme-btn active" data-theme="midnight" style="--sw1:#A855F7;--sw2:#0B0B16;"><span class="theme-swatch"></span>Midnight</button>
      <button class="theme-btn" data-theme="daylight" style="--sw1:#4F46E5;--sw2:#F4F6FB;"><span class="theme-swatch"></span>Daylight</button>
      <button class="theme-btn" data-theme="nordic" style="--sw1:#3F7B8C;--sw2:#ECEFF3;"><span class="theme-swatch"></span>Nordic</button>
      <button class="theme-btn" data-theme="ocean" style="--sw1:#22D3EE;--sw2:#07182B;"><span class="theme-swatch"></span>Ocean</button>
      <button class="theme-btn" data-theme="graphite" style="--sw1:#84CC16;--sw2:#0A0A0A;"><span class="theme-swatch"></span>Graphite</button>
      <button class="theme-btn" data-theme="mono" style="--sw1:#3E5A75;--sw2:#FFFFFF;"><span class="theme-swatch"></span>Mono</button>
    </div>
  </div>
</div>

<div class="strip" id="strip">
  <!-- frames are injected from JS templates below -->
</div>

<!-- Reusable templates -->
<template id="tpl-statusbar">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <i data-lucide="signal"></i>
      <i data-lucide="wifi"></i>
      <i data-lucide="battery-full"></i>
    </div>
  </div>
</template>

<template id="tpl-tabbar">
  <div class="tab-bar">
    <a class="tab" data-tab="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
    <a class="tab" data-tab="pet"><i data-lucide="paw-print"></i><span>Pet</span></a>
    <a class="tab" data-tab="meal"><i data-lucide="utensils"></i><span>Meal</span></a>
    <a class="tab" data-tab="med"><i data-lucide="pill"></i><span>Medicine</span></a>
    <a class="tab" data-tab="settings"><i data-lucide="settings"></i><span>Settings</span></a>
  </div>
</template>

<script>
/* ============================================================
   PetCare iOS prototype — 12 screens, 6 themes
   ============================================================ */

const SCREENS = [
  { id: 'login',     label: '01 · Login',          tab: null,         render: renderLogin },
  { id: 'dashboard', label: '02 · Dashboard',      tab: 'dashboard',  render: renderDashboard },
  { id: 'petlist',   label: '03 · Pet List',       tab: 'pet',        render: renderPetList },
  { id: 'petdetail', label: '04 · Pet Detail',     tab: 'pet',        render: renderPetDetail },
  { id: 'weight',    label: '05 · Weight',         tab: 'pet',        render: renderWeight },
  { id: 'weightadd', label: '06 · Add Weight',     tab: 'pet',        render: renderAddWeight,  hasSheet: true },
  { id: 'food',      label: '07 · Food Database',  tab: 'meal',       render: renderFood },
  { id: 'foodadd',   label: '08 · Add Food',       tab: 'meal',       render: renderAddFood,    hasSheet: true },
  { id: 'meal',      label: '09 · Meal Log',       tab: 'meal',       render: renderMeal },
  { id: 'medicine',  label: '10 · Medicine',       tab: 'med',        render: renderMedicine },
  { id: 'settings',  label: '11 · Settings',       tab: 'settings',   render: renderSettings },
  { id: 'invite',    label: '12 · Invite Group',   tab: 'settings',   render: renderInvite,     hasSheet: true },
];

function statusBar() {
  return `
    <div class="status-bar">
      <span>9:41</span>
      <div class="right">
        <i data-lucide="signal"></i>
        <i data-lucide="wifi"></i>
        <i data-lucide="battery-full"></i>
      </div>
    </div>
  `;
}

function tabBar(active) {
  const tabs = [
    ['dashboard', 'layout-dashboard', 'Dashboard'],
    ['pet',       'paw-print',        'Pet'],
    ['meal',      'utensils',         'Meal'],
    ['med',       'pill',             'Medicine'],
    ['settings',  'settings',         'Settings'],
  ];
  return `
    <div class="tab-bar">
      ${tabs.map(([id, ic, lbl]) => `
        <a class="tab ${active === id ? 'active' : ''}"><i data-lucide="${ic}"></i><span>${lbl}</span></a>
      `).join('')}
    </div>
    <div class="home-indicator"></div>
  `;
}

/* -- 01 Login ------------------------------------------------ */
function renderLogin() {
  return `
    ${statusBar()}
    <div class="flex-1 px-7 pt-10 pb-12 flex flex-col scroll-y">
      <div class="flex items-center gap-3 mb-12">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, var(--primary), var(--accent));">
          <i data-lucide="paw-print" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="text-[17px] font-semibold t-primary">PetCare</div>
          <div class="caption">A shared home for your animals</div>
        </div>
      </div>

      <div class="mb-10">
        <h1 class="title mb-2">Welcome back</h1>
        <p class="t-secondary text-[15px]">Sign in to keep tracking Luna's meals, weight, and meds with your family.</p>
      </div>

function ring(pct, value, total) {
  const c = 2 * Math.PI * 32;
  const off = c * (1 - pct/100);

      <text x="40" y="38" text-anchor="middle" transform="rotate(90 40 40)" font-size="13" font-weight="700" fill="var(--text-primary)">${pct}%</text>
    </svg>
  `;
}

function macro(name, value, pct) {
  return `
    <div>

  `;

function sparkline() {
  // 30 points: weight trending from 12.7 to 12.4
  const pts = [12.7,12.7,12.65,12.6,12.7,12.65,12.55,12.6,12.5,12.55,12.5,12.45,12.5,12.55,12.45,12.4,12.45,12.5,12.4,12.35,12.4,12.45,12.4,12.35,12.4,12.3,12.35,12.4,12.35,12.4];
  const min = 12.2, max = 12.8;
  const w = 320, h = 80;
  const pad = 4;
  const dx = (w - pad*2) / (pts.length - 1);
  const path = pts.map((v, i) => {
    const x = pad + i * dx;
    const y = pad + (max - v) / (max - min) * (h - pad*2);
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const area = path + ` L${(w-pad).toFixed(1)},${h} L${pad},${h} Z`;
  const targetY = pad + (max - 12.0) / (max - min) * (h - pad*2);
  return `
    <svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:80px; display:block;">
      <path d="${area}" class="area-fill-1"/>
      <line x1="0" y1="${targetY}" x2="${w}" y2="${targetY}" stroke="var(--text-muted)" stroke-dasharray="3 4" stroke-width="1" opacity="0.5"/>
      <path d="${path}" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((v, i) => i === pts.length - 1 ? `<circle cx="${pad + i*dx}" cy="${pad + (max-v)/(max-min)*(h-pad*2)}" r="3" fill="var(--chart-1)"/>` : '').join('')}
    </svg>
  `;
}

function bigChart() {
  // 90 days, weight 13.0 -> 12.4
  const N = 30;
  const seed = [13.0,12.95,12.9,12.95,12.85,12.9,12.8,12.85,12.75,12.8,12.7,12.75,12.7,12.65,12.7,12.6,12.65,12.55,12.6,12.5,12.55,12.5,12.45,12.5,12.45,12.5,12.4,12.45,12.35,12.4];
  const min = 11.8, max = 13.2;
  const w = 320, h = 170;
  const pad = 8, padR = 30;
  const dx = (w - pad - padR) / (seed.length - 1);
  const yOf = v => 10 + (max - v) / (max - min) * (h - 30);
  const path = seed.map((v,i) => `${i===0?'M':'L'}${(pad+i*dx).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
  const area = path + ` L${(pad+(seed.length-1)*dx).toFixed(1)},${h-10} L${pad},${h-10} Z`;
  const yTarget = yOf(12.0);
  const yHigh = yOf(12.8), yLow = yOf(11.8);
  return `
    <svg viewBox="0 0 ${w+12} ${h+20}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">
      <!-- healthy band -->
      <rect x="${pad}" y="${yHigh}" width="${w-pad-padR}" height="${(yLow-yHigh).toFixed(1)}" fill="var(--chart-3)" opacity="0.07"/>
      <!-- gridlines + labels -->
      ${[13.0, 12.5, 12.0].map(v => `
        <line x1="${pad}" y1="${yOf(v)}" x2="${w-padR}" y2="${yOf(v)}" stroke="var(--border)" stroke-width="1" opacity="0.6"/>
        <text x="${w-padR+4}" y="${yOf(v)+3}" font-size="9" fill="var(--text-muted)">${v.toFixed(1)}</text>
      `).join('')}
      <!-- target -->
      <line x1="${pad}" y1="${yTarget}" x2="${w-padR}" y2="${yTarget}" stroke="var(--text-muted)" stroke-dasharray="3 4" stroke-width="1" opacity="0.6"/>
      <!-- area + line -->
      <path d="${area}" fill="var(--chart-1)" opacity="0.10"/>
      <path d="${path}" fill="none" stroke="var(--chart-1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${seed.map((v,i) => i % 5 === 0 || i === seed.length-1 ? `<circle cx="${pad+i*dx}" cy="${yOf(v)}" r="${i===seed.length-1?3.5:2.2}" fill="var(--chart-1)" stroke="var(--surface)" stroke-width="${i===seed.length-1?2:1}"/>` : '').join('')}
      <!-- x labels -->

      <i data-lucide="chevron-right" class="w-4 h-4 t-muted"></i>
    </div>
  `;
}

function qrPlaceholder() {
  // simple 11x11 deterministic QR-ish pattern
  const grid = [
    "11111110111111",
    "10000010101010",
    "10111010110110",
    "10111010001010",
    "10111010110110",
    "10000010101010",
    "11111110111111",
    "00000001000000",
    "11010101110101",
    "01101110010110",
    "10101011101010",
    "01001110100101",
    "11111110011011",
    "10000010101110",
  ];
  let cells = '';
  const size = 8;
  grid.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (c === '1') cells += `<rect x="${x*size}" y="${y*size}" width="${size}" height="${size}" fill="#000"/>`;
    });
  });
  return `<svg viewBox="0 0 ${grid[0].length*size} ${grid.length*size}" width="100%" height="100%">${cells}</svg>`;
}

/* ============================================================
   Mount
   ============================================================ */
function buildStrip() {
  const strip = document.getElementById('strip');
  SCREENS.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    wrap.setAttribute('data-screen-label', s.label);
    wrap.innerHTML = `
      <div class="frame-num">${String(i+1).padStart(2,'0')}</div>
      <div class="iphone">
        <div class="notch"></div>
        <div class="iphone-screen">${s.render()}</div>
      </div>
      <div class="frame-label">${s.label.split('· ')[1]}</div>
    `;
    strip.appendChild(wrap);
  });
  if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
}

function setupThemes() {
  const picker = document.getElementById('themePicker');
  picker.addEventListener('click', e => {
    const btn = e.target.closest('[data-theme]');
    if (!btn) return;
    picker.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.setAttribute('data-theme', btn.dataset.theme);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  buildStrip();
  setupThemes();
});
</script>
